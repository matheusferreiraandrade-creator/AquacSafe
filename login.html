<!doctype html>
<html lang="pt-br" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcquaSafe - Login</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body class="h-full w-full bg-[#0a0f1a] text-white overflow-auto">
    <div class="h-full w-full flex flex-col">
        <div class="fixed inset-0 overflow-hidden pointer-events-none">
            <div class="absolute top-0 right-0 w-96 h-96 bg-cyan-500/5 rounded-full blur-3xl"></div>
            <div class="absolute bottom-0 left-0 w-96 h-96 bg-blue-500/5 rounded-full blur-3xl"></div>
        </div>

        <div class="relative flex-1 flex flex-col items-center justify-center px-4 py-8">
            <div class="text-center mb-12">
                <div class="flex items-center justify-center gap-3 mb-6">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center">
                        <i data-lucide="droplets" class="w-7 h-7 text-white"></i>
                    </div>
                    <span class="text-2xl font-bold gradient-text">AcquaSafe</span>
                </div>
                <h1 class="text-3xl sm:text-4xl font-bold mb-3">Bem-vindo ao AcquaSafe</h1>
                <p class="text-slate-400 text-lg">Monitoramento de qualidade de água em tempo real</p>
            </div>

            <div class="w-full max-w-md">
                <div class="glass-card glow-border rounded-2xl p-8 space-y-6">
                    <form class="space-y-5" onsubmit="handleLogin(event)">
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">Email ou CPF</label>
                            <input type="text" id="login-usuario" placeholder="usuario@email.com" 
                                   class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-white/40 transition-colors" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">Senha</label>
                            <input type="password" id="login-senha" placeholder="••••••••" 
                                   class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-white/40 transition-colors" required>
                        </div>
                        <button type="submit" class="w-full btn-gradient text-white font-semibold py-3 rounded-lg">
                            <span id="btn-text">Acessar Painel</span>
                        </button>
                    </form>
                    <p class="text-center text-white/60 text-sm">
                        Não tem conta? 
                        <a href="cadastro.html" class="text-cyan-400 hover:text-cyan-300 font-semibold transition-colors">Criar conta</a>
                    </p>
                </div>
            </div>
        </div>

        <footer class="relative py-6 border-t border-white/5 text-center text-sm text-white/50">
            <p>© 2026 AcquaSafe. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script>
        // Lógica de Login Embutida
        function handleLogin(event) {
            event.preventDefault();
            const login = document.getElementById('login-usuario').value.trim();
            const senha = document.getElementById('login-senha').value;
            const btnText = document.getElementById('btn-text');

            // CREDENCIAIS VÁLIDAS
            const USUARIO_VALIDO = 'usuario@email.com';
            const SENHA_VALIDA   = '123';

            btnText.textContent = 'Verificando...';

            setTimeout(() => {
                if (login === USUARIO_VALIDO && senha === SENHA_VALIDA) {
                    sessionStorage.setItem('usuarioLogado', 'true');
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Usuário ou senha incorretos! Use: usuario@email.com / 123');
                    btnText.textContent = 'Acessar Painel';
                    document.getElementById('login-senha').value = '';
                }
            }, 600);
        }
        lucide.createIcons();
    </script>
</body>
</html>
