<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcquaSafe – Admin Login</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <style>
        #toast {
            position: fixed; bottom: 2rem; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5; padding: 0.75rem 1.5rem; border-radius: 0.75rem;
            font-size: 0.875rem; font-weight: 500; backdrop-filter: blur(12px);
            transition: transform 0.35s, opacity 0.35s; opacity: 0; z-index: 9999;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .nav-card { cursor: pointer; transition: transform 0.2s; }
        .nav-card:hover { transform: translateY(-3px); }
    </style>
</head>
<body class="admin-bg">
    <div id="toast"><span id="toast-msg"></span></div>

    <div class="relative min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <div class="flex items-center justify-center gap-3 mb-4">
                    <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center">
                        <i data-lucide="shield" class="w-8 h-8 text-white"></i>
                    </div>
                    <span class="text-3xl font-bold gradient-text">AcquaSafe</span>
                </div>
                <h1 class="text-3xl font-bold">Painel Administrativo</h1>
                <p class="text-white/60 mt-2">Acesso restrito a administradores</p>
            </div>

            <div class="glass-card glow-border rounded-2xl p-8">
                <form onsubmit="event.preventDefault(); loginAdmin();" class="space-y-4">
                    <div>
                        <label class="block mb-2 text-sm font-medium">Usuário (login)</label>
                        <input type="text" id="usuario" class="input-field w-full px-4 py-3 rounded-lg" placeholder="admin" required>
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium">Senha Administrativa</label>
                        <input type="password" id="senha" class="input-field w-full px-4 py-3 rounded-lg" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="w-full btn-gradient py-3 rounded-lg font-semibold">Entrar no Painel</button>
                </form>
                <div id="login-error" class="hidden mt-4 text-center text-red-400 text-sm bg-red-500/10 border border-red-500/30 rounded-lg py-2">
                    Usuário ou senha incorretos.
                </div>
                <p class="text-center text-white/50 text-sm mt-6">
                    <a href="index.html" class="hover:text-cyan-400 transition-colors">← Voltar ao login</a>
                </p>
            </div>

            <div class="grid grid-cols-3 gap-3 mt-6">
                <div class="glass-card rounded-xl p-4 text-center nav-card" onclick="navAdmin('admin-clientes.html', 'Clientes')">
                    <i data-lucide="users" class="w-6 h-6 mx-auto text-cyan-400 mb-2"></i>
                    <p class="text-xs text-white/70">Clientes</p>
                </div>
                <div class="glass-card rounded-xl p-4 text-center nav-card" onclick="navAdmin('admin-doencas.html', 'Doenças')">
                    <i data-lucide="shield-alert" class="w-6 h-6 mx-auto text-blue-400 mb-2"></i>
                    <p class="text-xs text-white/70">Doenças</p>
                </div>
                <div class="glass-card rounded-xl p-4 text-center nav-card" onclick="navAdmin('admin-bloqueios.html', 'Bloqueios')">
                    <i data-lucide="ban" class="w-6 h-6 mx-auto text-red-400 mb-2"></i>
                    <p class="text-xs text-white/70">Bloqueios</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = 'admin123';

        function loginAdmin() {
            const u = document.getElementById('usuario').value.trim();
            const s = document.getElementById('senha').value;
            const err = document.getElementById('login-error');

            if (u === ADMIN_USER && s === ADMIN_PASS) {
                sessionStorage.setItem('adminLogado', 'true');
                window.location.href = 'admin-clientes.html';
            } else {
                err.classList.remove('hidden');
                document.getElementById('senha').value = '';
            }
        }

        function navAdmin(pagina, nome) {
            if (sessionStorage.getItem('adminLogado') === 'true') {
                window.location.href = pagina;
            } else {
                showToast('Faça login para acessar ' + nome);
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        lucide.createIcons();
    </script>
</body>
</html>
